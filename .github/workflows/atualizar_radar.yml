name: Atualizar Radar Viral e publicar site
on:
  push:
    branches: [main]
  schedule:
    - cron: '19 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar tendências e notícias por país
        run: python scripts/collect.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar painel online
        id: deployment
        uses: actions/deploy-pages@v4
